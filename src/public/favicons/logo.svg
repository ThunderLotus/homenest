<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 活力橙渐变背景 -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A44" />
      <stop offset="100%" stop-color="#FC6076" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形底板 -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#orangeGradient)"/>
  
  <g transform="translate(0, 8)">
    <!-- 1. 房顶与烟囱 (Home) -->
    <!-- 烟囱 -->
    <rect x="160" y="55" width="16" height="25" fill="#ffffff" rx="3"/>
    <!-- 房顶 -->
    <path d="M 128 45 L 55 105" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 128 45 L 201 105" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- 2. 三枚鸟蛋 (代表导航节点) -->
    <!-- 左边的蛋 (稍微倾斜) -->
    <ellipse cx="102" cy="118" rx="14" ry="19" fill="#ffffff" transform="rotate(-20 102 118)"/>
    <!-- 中间的蛋 (最大，居中) -->
    <ellipse cx="128" cy="112" rx="16" ry="22" fill="#ffffff"/>
    <!-- 右边的蛋 (稍微倾斜) -->
    <ellipse cx="154" cy="118" rx="14" ry="19" fill="#ffffff" transform="rotate(20 154 118)"/>

    <!-- 3. 鸟巢底座 (半透明，增加立体感) -->
    <path d="M 60 128 C 60 195 196 195 196 128 Z" fill="#ffffff" opacity="0.25"/>

    <!-- 4. 树枝编织的鸟巢主体 (Nest) -->
    <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" fill="none">
      <!-- 鸟巢前沿的主承重枝条 -->
      <path d="M 45 128 Q 128 145 211 128" stroke-width="14"/>
      
      <!-- 交错的编织树枝 -->
      <line x1="60" y1="145" x2="160" y2="175" />
      <line x1="195" y1="140" x2="90" y2="175" />
      <line x1="75" y1="165" x2="135" y2="188" />
      <line x1="180" y1="160" x2="115" y2="188" />
      
      <!-- 翘出来的随性质感杂枝 -->
      <line x1="45" y1="145" x2="65" y2="135" />
      <line x1="210" y1="148" x2="190" y2="138" />
    </g>

    <!-- 5. 可爱的小树叶 (增加生命力和自然气息) -->
    <path d="M 45 145 Q 20 155 35 170 Q 55 155 45 145 Z" fill="#ffffff"/>
    <path d="M 210 148 Q 235 140 225 125 Q 205 135 210 148 Z" fill="#ffffff"/>
  </g>
</svg>